{% extends "base.html" %}

{% block content %}

<style>
    .welcome-card {
        max-width: 620px;
        margin: 70px auto;
        text-align: center;
        padding: 50px 40px;
    }

    .welcome-icon {
        width: 82px;
        height: 82px;
        margin: 0 auto 25px;
        border-radius: 24px;
        background: linear-gradient(135deg, #173b73, #2563eb);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 40px;
        box-shadow: 0 10px 25px rgba(37, 99, 235, 0.25);
    }

    .welcome-card h1 {
        margin: 0 0 12px;
        font-size: 32px;
        color: #173b73;
    }

    .welcome-card .subtitle {
        margin: 0 auto 30px;
        max-width: 480px;
        color: #6b7280;
        font-size: 16px;
        line-height: 1.6;
    }

    .welcome-card input {
        width: 100%;
        padding: 15px 18px;
        border: 1px solid #d1d5db;
        border-radius: 10px;
        font-size: 16px;
        outline: none;
        margin-bottom: 15px;
    }

    .welcome-card input:focus {
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .welcome-card button {
        width: 100%;
        padding: 15px;
        border: none;
        border-radius: 10px;
        background: linear-gradient(135deg, #173b73, #2563eb);
        color: white;
        font-size: 15px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s;
    }

    .welcome-card button:hover {
        transform: translateY(-1px);
        box-shadow: 0 8px 20px rgba(37, 99, 235, 0.25);
    }

    .error {
        background: #fee2e2;
        color: #b91c1c;
        padding: 12px;
        border-radius: 8px;
        margin-bottom: 15px;
        font-size: 14px;
    }

    .brand {
        font-size: 14px;
        font-weight: bold;
        color: #2563eb;
        margin-bottom: 10px;
        letter-spacing: 0.5px;
    }

    @media (max-width: 600px) {
        .welcome-card {
            margin: 30px auto;
            padding: 35px 22px;
        }

        .welcome-card h1 {
            font-size: 26px;
        }
    }
</style>

<section class="card login welcome-card">

```
<div class="welcome-icon">📚</div>

<div class="brand">
    PƏRVİZ HÜSEYNOV
</div>

<h1>Rəqəmsal İmtahan Mərkəzi</h1>

<p class="subtitle">
    Əmək Məcəlləsi 2026 üzrə test imtahanına xoş gəlmisiniz.
    İmtahana başlamaq üçün ad və soyadınızı daxil edin.
</p>

{% if error %}
    <div class="error">
        {{ error }}
    </div>
{% endif %}

<form method="post">

    <input
        type="text"
        name="name"
        placeholder="Ad və soyadınızı daxil edin"
        autocomplete="name"
        autofocus
        required
    >

    <button type="submit">
        TESTƏ BAŞLA →
    </button>

</form>
```

</section>

{% endblock %}
