```html
<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Əmək Məcəlləsi 2026 - Test</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f6fa;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 750px;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .name {
            font-weight: bold;
        }

        .progress {
            color: #666;
        }

        h2 {
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .option {
            display: block;
            padding: 15px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }

        .option:hover {
            background: #f0f4ff;
        }

        .option input {
            margin-right: 10px;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }

        button,
        .finish-button {
            flex: 1;
            padding: 14px 20px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
        }

        .next-button {
            background: #2563eb;
            color: white;
        }

        .next-button:hover {
            background: #1d4ed8;
        }

        .finish-button {
            background: #dc2626;
            color: white;
        }

        .finish-button:hover {
            background: #b91c1c;
        }

        .warning {
            margin-top: 15px;
            color: #b91c1c;
            font-size: 14px;
            text-align: center;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            .buttons {
                flex-direction: column;
            }

            .top {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="top">
        <div class="name">
            {{ name }}
        </div>

        <div class="progress">
            Sual {{ n + 1 }} / {{ total }}
        </div>
    </div>


    <form method="POST">

        <h2>
            {{ q["question"] }}
        </h2>


        <label class="option">
            <input
                type="radio"
                name="answer"
                value="A"
                {% if current_answer == "A" %}checked{% endif %}
            >
            {{ q["a"] }}
        </label>


        <label class="option">
            <input
                type="radio"
                name="answer"
                value="B"
                {% if current_answer == "B" %}checked{% endif %}
            >
            {{ q["b"] }}
        </label>


        <label class="option">
            <input
                type="radio"
                name="answer"
                value="C"
                {% if current_answer == "C" %}checked{% endif %}
            >
            {{ q["c"] }}
        </label>


        <label class="option">
            <input
                type="radio"
                name="answer"
                value="D"
                {% if current_answer == "D" %}checked{% endif %}
            >
            {{ q["d"] }}
        </label>


        <div class="buttons">

            <!-- NÖVBƏTİ -->
            <button
                type="submit"
                class="next-button"
            >
                NÖVBƏTİ
            </button>


            <!-- TESTİ BİTİR -->
            <button
                type="button"
                class="finish-button"
                onclick="finishTest()"
            >
                TESTİ BİTİR
            </button>

        </div>

    </form>


    <div class="warning">
        Testi bitirdikdə yalnız cavablandırdığınız suallar nəticəyə daxil ediləcək.
    </div>

</div>


<script>

function finishTest() {

    const confirmed = confirm(
        "Testi bitirmək istədiyinizə əminsiniz?\n\n" +
        "Cavablandırdığınız suallar yadda saxlanılacaq və nəticə hesablanacaq."
    );

    if (confirmed) {

        window.location.href = "{{ url_for('finish') }}";

    }

}

</script>

</body>
</html>
```
