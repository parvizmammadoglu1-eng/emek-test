{% extends "base.html" %}

{% block content %}

<style>

    .question-page {
        min-height: 75vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 30px 15px;
    }

    .question-card {
        width: 100%;
        max-width: 760px;
        background: #ffffff;
        border-radius: 24px;
        padding: 35px;
        box-shadow: 0 12px 40px rgba(0,0,0,0.08);
        border: 1px solid #e5e7eb;
    }

    /* =====================================================
       İMTAHAN BAŞLAMA VAXTI
    ===================================================== */

    .exam-time-box {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;

        background: #eff6ff;
        color: #173b73;

        border: 1px solid #bfdbfe;

        border-radius: 12px;

        padding: 11px 15px;

        margin-bottom: 25px;

        font-size: 14px;
        font-weight: 700;

        text-align: center;
    }

    .exam-time-box span {
        white-space: nowrap;
    }

    .test-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 15px;
        margin-bottom: 25px;
    }

    .question-number {
        font-size: 15px;
        font-weight: 800;
        color: #173b73;
    }

    .question-counter {
        color: #6b7280;
        font-size: 14px;
    }

    .progress {
        height: 8px;
        background: #e5e7eb;
        border-radius: 20px;
        overflow: hidden;
        margin-bottom: 30px;
    }

    .progress-bar {
        height: 100%;
        background: linear-gradient(
            135deg,
            #173b73,
            #2563eb
        );
        border-radius: 20px;
        transition: width 0.3s ease;
    }

    .question-text {
        color: #172033;
        font-size: 21px;
        line-height: 1.5;
        font-weight: 800;
        margin-bottom: 25px;
    }

    .answer-option {
        display: block;
        width: 100%;
        margin-bottom: 12px;
        padding: 16px;
        border: 2px solid #e5e7eb;
        border-radius: 13px;
        background: #ffffff;
        cursor: pointer;
        transition: all 0.2s ease;
        color: #374151;
        font-size: 15px;
        line-height: 1.45;
    }

    .answer-option:hover {
        border-color: #93c5fd;
        background: #f8fbff;
        transform: translateY(-1px);
    }

    .answer-option input {
        margin-right: 10px;
        accent-color: #2563eb;
    }

    .answer-option:has(input:checked) {
        border-color: #2563eb;
        background: #eff6ff;
        color: #173b73;
        font-weight: 700;
    }

    .buttons {
        display: flex;
        gap: 12px;
        margin-top: 25px;
    }

    .next-button,
    .finish-button {
        width: 100%;
        border: none;
        border-radius: 12px;
        padding: 15px;
        color: white;
        font-size: 15px;
        font-weight: 800;
        cursor: pointer;
        transition: 0.2s;
    }

    .next-button {
        background: linear-gradient(
            135deg,
            #173b73,
            #2563eb
        );
    }

    .finish-button {
        background: linear-gradient(
            135deg,
            #15803d,
            #16a34a
        );
    }

    .next-button:hover,
    .finish-button:hover {
        transform: translateY(-2px);
    }

    @media (max-width: 600px) {

        .question-page {
            padding: 15px 7px;
        }

        .question-card {
            padding: 22px 15px;
            border-radius: 18px;
        }

        .exam-time-box {
            font-size: 11px;
            padding: 9px 6px;
            margin-bottom: 20px;
        }

        .test-header {
            margin-bottom: 20px;
        }

        .question-text {
            font-size: 18px;
        }

        .answer-option {
            padding: 14px 12px;
            font-size: 14px;
        }

        .buttons {
            gap: 8px;
        }

        .next-button,
        .finish-button {
            padding: 14px 8px;
            font-size: 13px;
        }
    }

</style>


<div class="question-page">

    <div class="question-card">

        <!-- =================================================
             İMTAHAN BAŞLAMA VAXTI
        ================================================= -->

        <div class="exam-time-box">

            🟢

            <span>
                İmtahan başladı:
            </span>

            <span>
                {{ exam_start }}
            </span>

        </div>


        <!-- =================================================
             BAŞLIQ
        ================================================= -->

        <div class="test-header">

            <div class="question-number">
                Sual {{ n + 1 }}
            </div>

            <div class="question-counter">
                {{ n + 1 }} / {{ total }}
            </div>

        </div>


        <!-- =================================================
             PROGRESS
        ================================================= -->

        <div class="progress">

            <div
                class="progress-bar"
                style="width: {{ ((n + 1) / total * 100) }}%;"
            ></div>

        </div>


        <!-- =================================================
             SUAL
        ================================================= -->

        <div class="question-text">

            {{ q.question }}

        </div>


        <!-- =================================================
             CAVABLAR
        ================================================= -->

        <form method="post">

            <label class="answer-option">

                <input
                    type="radio"
                    name="answer"
                    value="A"
                >

                {{ q.a }}

            </label>


            <label class="answer-option">

                <input
                    type="radio"
                    name="answer"
                    value="B"
                >

                {{ q.b }}

            </label>


            <label class="answer-option">

                <input
                    type="radio"
                    name="answer"
                    value="C"
                >

                {{ q.c }}

            </label>


            <label class="answer-option">

                <input
                    type="radio"
                    name="answer"
                    value="D"
                >

                {{ q.d }}

            </label>


            <!-- =================================================
                 DÜYMƏ
            ================================================= -->

            <div class="buttons">

                {% if n + 1 == total %}

                    <button
                        type="submit"
                        class="finish-button"
                    >
                        TESTİ BİTİR ✓
                    </button>

                {% else %}

                    <button
                        type="submit"
                        class="next-button"
                    >
                        NÖVBƏTİ →
                    </button>

                {% endif %}

            </div>

        </form>

    </div>

</div>

{% endblock %}
