<!DOCTYPE html>
<html lang="az">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Əmək Məcəlləsi</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>

        .top-header {
            width: 100%;
            box-sizing: border-box;
            background: #173b73;
            color: white;
            padding: 15px 25px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            font-family: Arial, sans-serif;
        }

        .top-info {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            color: white;
            background: rgba(255,255,255,0.10);
            padding: 9px 14px;
            border-radius: 10px;
        }

        .top-info-item {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            color: white;
        }

        .top-separator {
            opacity: 0.65;
        }

        @media (max-width: 600px) {

            .top-header {
                padding: 10px;
            }

            .top-info {
                font-size: 12px;
                gap: 7px;
                padding: 8px 10px;
            }

        }

    </style>

</head>


<body>


<header class="top-header">

    <div class="top-info">

        <span class="top-info-item">
            🕐
            <span id="live-clock">00:00:00</span>
        </span>

        <span class="top-separator">|</span>

        <span class="top-info-item">
            📅
            <span id="live-date">00.00.0000</span>
        </span>

        <span class="top-separator">|</span>

        <span class="top-info-item">
            ☀️ Bakı 29°C
        </span>

    </div>

</header>


<main>

    {% block content %}

    {% endblock %}

</main>


<script>

function updateDateTime() {

    const now = new Date();

    const utcTime =
        now.getTime() +
        (now.getTimezoneOffset() * 60000);

    const bakuTime =
        new Date(
            utcTime + (4 * 60 * 60 * 1000)
        );


    const hours =
        String(
            bakuTime.getHours()
        ).padStart(2, "0");

    const minutes =
        String(
            bakuTime.getMinutes()
        ).padStart(2, "0");

    const seconds =
        String(
            bakuTime.getSeconds()
        ).padStart(2, "0");


    document.getElementById(
        "live-clock"
    ).textContent =
        hours + ":" +
        minutes + ":" +
        seconds;


    const day =
        String(
            bakuTime.getDate()
        ).padStart(2, "0");

    const month =
        String(
            bakuTime.getMonth() + 1
        ).padStart(2, "0");

    const year =
        bakuTime.getFullYear();


    document.getElementById(
        "live-date"
    ).textContent =
        day + "." +
        month + "." +
        year;

}


updateDateTime();

setInterval(
    updateDateTime,
    1000
);

</script>


</body>

</html>
