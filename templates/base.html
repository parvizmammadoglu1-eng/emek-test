<!doctype html>
<html lang="az">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Əmək Məcəlləsi</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

    <style>

        /* =====================================================
           HEADER
           ===================================================== */

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding: 14px 30px;
            box-sizing: border-box;
        }


        .header-left {
            display: flex;
            align-items: center;
            gap: 25px;
        }


        .logo {
            white-space: nowrap;
        }


        .tag {
            white-space: nowrap;
        }


        /* =====================================================
           SAAT / TARİX / HAVA
           ===================================================== */

        .header-info {

            display: flex;
            align-items: center;
            justify-content: flex-end;

            gap: 18px;

            color: white;

            font-size: 14px;
            font-weight: 600;

            white-space: nowrap;
        }


        .header-item {

            display: flex;
            align-items: center;

            gap: 6px;
        }


        .header-icon {

            font-size: 17px;
        }


        /* =====================================================
           MOBİL
           ===================================================== */

        @media (max-width: 850px) {

            header {

                flex-wrap: wrap;

                padding: 12px 15px;
            }


            .header-left {

                width: 100%;

                justify-content: space-between;
            }


            .header-info {

                width: 100%;

                justify-content: center;

                gap: 12px;

                font-size: 13px;
            }

        }


        @media (max-width: 550px) {

            .logo {

                font-size: 18px;
            }


            .tag {

                font-size: 11px;
            }


            .header-info {

                gap: 8px;

                font-size: 11px;

                flex-wrap: wrap;
            }


            .header-icon {

                font-size: 14px;
            }

        }

    </style>

</head>


<body>


<header>


    <!-- =====================================================
         SOL TƏRƏF
         ===================================================== -->

    <div class="header-left">


        <div class="logo">

            ƏMƏK MƏCƏLLƏSİ

            <span></span>

        </div>


        <div class="tag">

            TEST SİSTEMİ

        </div>


    </div>



    <!-- =====================================================
         SAĞ TƏRƏF
         ===================================================== -->

    <div class="header-info">


        <!-- SAAT -->

        <div class="header-item">

            <span class="header-icon">
                🕐
            </span>

            <span id="liveClock">
                00:00:00
            </span>

        </div>


        <!-- AYIRICI -->

        <span>|</span>


        <!-- TARİX -->

        <div class="header-item">

            <span class="header-icon">
                📅
            </span>

            <span id="liveDate">
                00.00.0000
            </span>

        </div>


        <!-- AYIRICI -->

        <span>|</span>


        <!-- HAVA -->

        <div class="header-item">

            <span class="header-icon">
                ☀️
            </span>

            <span>
                Bakı 29°C
            </span>

        </div>


    </div>


</header>



<!-- =========================================================
     SƏHİFƏ MƏZMUNU
     ========================================================= -->

<main>

    {% block content %}

    {% endblock %}

</main>



<!-- =========================================================
     CANLI SAAT VƏ TARİX
     ========================================================= -->

<script>

    function updateDateTime() {


        /*
         * Azərbaycan vaxtı
         *
         * UTC + 4
         */

        const now = new Date();


        /* =================================================
           SAAT
           ================================================= */

        const hours = String(
            now.getHours()
        ).padStart(2, "0");


        const minutes = String(
            now.getMinutes()
        ).padStart(2, "0");


        const seconds = String(
            now.getSeconds()
        ).padStart(2, "0");


        document.getElementById(
            "liveClock"
        ).textContent =
            hours + ":" +
            minutes + ":" +
            seconds;



        /* =================================================
           TARİX
           ================================================= */

        const day = String(
            now.getDate()
        ).padStart(2, "0");


        const month = String(
            now.getMonth() + 1
        ).padStart(2, "0");


        const year =
            now.getFullYear();


        document.getElementById(
            "liveDate"
        ).textContent =
            day + "." +
            month + "." +
            year;

    }


    /* Səhifə açılan kimi göstər */

    updateDateTime();


    /* Hər saniyə yenilə */

    setInterval(
        updateDateTime,
        1000
    );

</script>


</body>

</html>
