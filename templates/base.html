<!DOCTYPE html>
<html lang="az">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Əmək Məcəlləsi</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>

        /* =====================================================
           ÜST HEADER
           ===================================================== */

        .top-header {
            width: 100%;
            box-sizing: border-box;

            background: #173b73;

            color: white;

            padding: 15px 25px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 20px;

            font-family: Arial, sans-serif;
        }


        /* SOL HİSSƏ */

        .top-header-left {

            display: flex;

            align-items: center;

            gap: 25px;

            min-width: 0;
        }


        .top-logo {

            font-size: 20px;

            font-weight: 800;

            white-space: nowrap;
        }


        .top-tag {

            font-size: 12px;

            font-weight: 600;

            opacity: 0.85;

            white-space: nowrap;
        }


        /* =====================================================
           SAAT / TARİX / HAVA
           ===================================================== */

        .top-info {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 10px;

            font-size: 14px;

            font-weight: 600;

            white-space: nowrap;

            color: #ffffff;

            background: rgba(255,255,255,0.10);

            padding: 9px 14px;

            border-radius: 10px;
        }


        .top-info-item {

            display: inline-flex;

            align-items: center;

            gap: 5px;

            color: white;
        }


        .top-separator {

            opacity: 0.65;
        }


        /* =====================================================
           MOBİL
           ===================================================== */

        @media (max-width: 700px) {

            .top-header {

                flex-direction: column;

                padding: 12px 10px;

                gap: 10px;
            }


            .top-header-left {

                width: 100%;

                justify-content: center;
            }


            .top-info {

                width: auto;

                font-size: 12px;

                padding: 8px 10px;
            }

        }


        @media (max-width: 450px) {

            .top-logo {

                font-size: 17px;
            }


            .top-tag {

                font-size: 10px;
            }


            .top-info {

                font-size: 11px;

                gap: 6px;
            }

        }

    </style>

</head>


<body>


<!-- =========================================================
     HEADER
     ========================================================= -->

<header class="top-header">


    <!-- SOL TƏRƏF -->

    <div class="top-header-left">

        <div class="top-logo">

            ƏMƏK MƏCƏLLƏSİ

        </div>


        <div class="top-tag">

            TEST SİSTEMİ

        </div>

    </div>



    <!-- SAĞ TƏRƏF -->

    <div class="top-info">


        <!-- SAAT -->

        <span class="top-info-item">

            🕐

            <span id="live-clock">
                00:00:00
            </span>

        </span>


        <span class="top-separator">
            |
        </span>


        <!-- TARİX -->

        <span class="top-info-item">

            📅

            <span id="live-date">
                00.00.0000
            </span>

        </span>


        <span class="top-separator">
            |
        </span>


        <!-- HAVA -->

        <span class="top-info-item">

            ☀️

            Bakı 29°C

        </span>


    </div>


</header>



<!-- =========================================================
     SƏHİFƏ
     ========================================================= -->

<main>

    {% block content %}

    {% endblock %}

</main>



<!-- =========================================================
     JAVASCRIPT
     ========================================================= -->

<script>

function updateDateTime() {

    /*
     * Azərbaycan vaxtı UTC+4-dür.
     * Brauzerin lokal saatından asılı olmaması üçün
     * UTC vaxtına 4 saat əlavə edirik.
     */

    const now = new Date();


    /* UTC */

    const utcTime =
        now.getTime() +
        (now.getTimezoneOffset() * 60000);


    /* Bakı = UTC + 4 */

    const bakuTime =
        new Date(
            utcTime + (4 * 60 * 60 * 1000)
        );


    /* =====================================================
       SAAT
       ===================================================== */

    const hours =
        String(
            bakuTime.getHours()
        ).padStart(2, "0");


    const minutes =
        String(
            bakuTime.getMinutes()
        ).padStart(2, "0");


    const seconds =
        String(
            bakuTime.getSeconds()
        ).padStart(2, "0");


    document.getElementById(
        "live-clock"
    ).textContent =
        hours + ":" +
        minutes + ":" +
        seconds;



    /* =====================================================
       TARİX
       ===================================================== */

    const day =
        String(
            bakuTime.getDate()
        ).padStart(2, "0");


    const month =
        String(
            bakuTime.getMonth() + 1
        ).padStart(2, "0");


    const year =
        bakuTime.getFullYear();


    document.getElementById(
        "live-date"
    ).textContent =
        day + "." +
        month + "." +
        year;

}


/* İlk açılışda göstər */

updateDateTime();


/* Hər saniyə yenilə */

setInterval(
    updateDateTime,
    1000
);

</script>


</body>

</html>
