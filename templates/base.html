<!doctype html>
<html lang="az">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Əmək Məcəlləsi</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            overflow-x: hidden;
        }

        body {
            min-height: 100vh;
        }

        /* =====================================================
           YUXARI MƏLUMAT PANELİ
           ===================================================== */

        .top-info {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;

            padding: 10px 15px;

            background: #f8fafc;
            border-bottom: 1px solid #e5e7eb;

            color: #374151;

            font-size: 14px;
            font-weight: 600;

            white-space: nowrap;

            overflow: hidden;
        }

        .top-info-inner {
            display: flex;
            align-items: center;
            justify-content: center;

            max-width: 100%;

            gap: 8px;

            text-align: center;
        }

        .top-info-item {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            white-space: nowrap;
        }

        .top-info-separator {
            color: #9ca3af;
            margin: 0 2px;
        }

        #weather {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            white-space: nowrap;
        }

        /* =====================================================
           MOBİL
           ===================================================== */

        @media (max-width: 600px) {

            .top-info {
                padding: 9px 5px;
                font-size: 12px;
            }

            .top-info-inner {
                gap: 5px;
                width: 100%;
            }

            .top-info-separator {
                margin: 0 1px;
            }

        }

        @media (max-width: 380px) {

            .top-info {
                font-size: 11px;
                padding-left: 2px;
                padding-right: 2px;
            }

            .top-info-inner {
                gap: 3px;
            }

        }

    </style>

</head>


<body>


<!-- =========================================================
     SAAT / TARİX / HAVA
     ========================================================= -->

<div class="top-info">

    <div class="top-info-inner">

        <span class="top-info-item">
            🕐
            <span id="clock">
                --:--:--
            </span>
        </span>


        <span class="top-info-separator">
            |
        </span>


        <span class="top-info-item">
            📅
            <span id="date">
                --.--.----
            </span>
        </span>


        <span class="top-info-separator">
            |
        </span>


        <span
            class="top-info-item"
            id="weather"
        >
            🌤️ Bakı --°C
        </span>

    </div>

</div>


<!-- =========================================================
     SƏHİFƏLƏR
     ========================================================= -->

<main>

    {% block content %}{% endblock %}

</main>


<script>

/* =========================================================
   SAAT VƏ TARİX
   ========================================================= */

function updateClock() {

    const now = new Date();

    const hours = String(
        now.getHours()
    ).padStart(2, "0");

    const minutes = String(
        now.getMinutes()
    ).padStart(2, "0");

    const seconds = String(
        now.getSeconds()
    ).padStart(2, "0");


    const day = String(
        now.getDate()
    ).padStart(2, "0");

    const month = String(
        now.getMonth() + 1
    ).padStart(2, "0");

    const year = now.getFullYear();


    document.getElementById("clock").textContent =
        `${hours}:${minutes}:${seconds}`;


    document.getElementById("date").textContent =
        `${day}.${month}.${year}`;
}


/* =========================================================
   İLK SAAT
   ========================================================= */

updateClock();


/* =========================================================
   HƏR SANİYƏ YENİLƏ
   ========================================================= */

setInterval(
    updateClock,
    1000
);


/* =========================================================
   HAVA İKONASI
   Open-Meteo weather codes
   ========================================================= */

function getWeatherIcon(code) {

    code = Number(code);


    if (code === 0) {

        return "☀️";

    }


    if (
        code === 1 ||
        code === 2
    ) {

        return "🌤️";

    }


    if (code === 3) {

        return "☁️";

    }


    if (
        code === 45 ||
        code === 48
    ) {

        return "🌫️";

    }


    if (
        code >= 51 &&
        code <= 57
    ) {

        return "🌦️";

    }


    if (
        code >= 61 &&
        code <= 67
    ) {

        return "🌧️";

    }


    if (
        code >= 71 &&
        code <= 77
    ) {

        return "❄️";

    }


    if (
        code >= 80 &&
        code <= 82
    ) {

        return "🌦️";

    }


    if (
        code >= 85 &&
        code <= 86
    ) {

        return "🌨️";

    }


    if (
        code >= 95 &&
        code <= 99
    ) {

        return "⛈️";

    }


    return "🌤️";
}


/* =========================================================
   ŞƏHƏR ADINI MÜƏYYƏNLƏŞDİR
   Nominatim OpenStreetMap
   ========================================================= */

async function getCityName(
    latitude,
    longitude
) {

    try {

        const response = await fetch(

            `https://nominatim.openstreetmap.org/reverse` +
            `?format=jsonv2` +
            `&lat=${latitude}` +
            `&lon=${longitude}` +
            `&accept-language=az`

        );


        if (!response.ok) {

            throw new Error(
                "Şəhər müəyyən edilə bilmədi."
            );

        }


        const data =
            await response.json();


        const address =
            data.address || {};


        return (

            address.city ||

            address.town ||

            address.municipality ||

            address.village ||

            address.county ||

            "Naməlum"

        );

    }

    catch (error) {

        console.log(
            "Şəhər müəyyənləşdirmə xətası:",
            error
        );


        return "Bakı";
    }
}


/* =========================================================
   HAVA MƏLUMATINI AL
   Open-Meteo API
   ========================================================= */

async function loadWeather(
    latitude,
    longitude,
    city
) {

    try {

        const url =

            `https://api.open-meteo.com/v1/forecast` +

            `?latitude=${latitude}` +

            `&longitude=${longitude}` +

            `&current=temperature_2m,weather_code` +

            `&timezone=auto`;


        const response =
            await fetch(url);


        if (!response.ok) {

            throw new Error(
                "Hava məlumatı alınmadı."
            );

        }


        const data =
            await response.json();


        const temperature =
            Math.round(
                data.current.temperature_2m
            );


        const weatherCode =
            data.current.weather_code;


        const icon =
            getWeatherIcon(
                weatherCode
            );


        document.getElementById(
            "weather"
        ).textContent =

            `${icon} ${city} ${temperature}°C`;

    }

    catch (error) {

        console.log(
            "Hava məlumatı xətası:",
            error
        );


        document.getElementById(
            "weather"
        ).textContent =

            "🌤️ Bakı --°C";
    }
}


/* =========================================================
   BAKI DEFAULT
   ========================================================= */

const BAKU_LATITUDE =
    40.4093;

const BAKU_LONGITUDE =
    49.8671;


/* =========================================================
   LOKASİYA İCAZƏSİ VARSA
   İSTİFADƏÇİNİN YERİNİ GÖTÜR
   ========================================================= */

function detectLocation() {

    if (
        !navigator.geolocation
    ) {

        loadWeather(
            BAKU_LATITUDE,
            BAKU_LONGITUDE,
            "Bakı"
        );

        return;
    }


    navigator.geolocation.getCurrentPosition(

        async function(position) {

            const latitude =
                position.coords.latitude;

            const longitude =
                position.coords.longitude;


            const city =
                await getCityName(
                    latitude,
                    longitude
                );


            loadWeather(
                latitude,
                longitude,
                city
            );

        },


        function(error) {

            console.log(
                "Lokasiya icazəsi verilmədi:",
                error
            );


            loadWeather(
                BAKU_LATITUDE,
                BAKU_LONGITUDE,
                "Bakı"
            );

        },


        {
            enableHighAccuracy: true,
            timeout: 10000,
            maximumAge: 300000
        }

    );
}


/* =========================================================
   HAVA MƏLUMATINI İLK DƏFƏ YÜKLƏ
   ========================================================= */

detectLocation();


/* =========================================================
   HAVA MƏLUMATINI 10 DƏQİQƏDƏN BİR YENİLƏ
   ========================================================= */

setInterval(

    function() {

        detectLocation();

    },

    10 * 60 * 1000

);

</script>


</body>

</html>
