<!doctype html>
<html lang="az">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Əmək Məcəlləsi 2026</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<!-- ==================================================
     ƏMƏK MƏCƏLLƏSİ 2026 — LOADING SCREEN
================================================== -->

<div id="loading-screen">

    <!-- Arxa dekorativ dairələr -->
    <div class="glow glow-one"></div>
    <div class="glow glow-two"></div>

    <div class="loader-container">

        <!-- Logo -->
        <div class="loader-logo">
            <div class="scale-icon">⚖</div>

            <div class="brand">
                <div class="brand-title">
                    ƏMƏK MƏCƏLLƏSİ
                </div>

                <div class="brand-year">
                    2026
                </div>
            </div>
        </div>


        <!-- Xoş gəldiniz -->
        <div class="welcome-text">
            Test platformasına xoş gəlmisiniz!
        </div>

        <div class="welcome-subtitle">
            Biliklərinizi sınamağa hazır olun.
        </div>


        <!-- Loading dairəsi -->
        <div class="loader-circle">

            <div class="circle-inner">
                <span id="progress-number">0%</span>
            </div>

        </div>


        <!-- Status -->
        <div class="status-title" id="status-title">
            Sistem hazırlanır...
        </div>

        <div class="status-subtitle" id="status-subtitle">
            Zəhmət olmasa bir neçə saniyə gözləyin.
        </div>


        <!-- Progress -->
        <div class="progress-wrapper">

            <div class="progress-background">
                <div id="progress-bar"></div>
            </div>

        </div>


        <!-- Alt məlumat -->
        <div class="loading-info">

            <span id="loading-step">
                Hazırlıq mərhələsi
            </span>

            <span>
                2026
            </span>

        </div>

    </div>

</div>


<!-- ==================================================
     ƏSAS SAYT
================================================== -->

<div id="main-site">

    <header>

        <div class="logo">
            ƏMƏK MƏCƏLLƏSİ
            <span></span>
        </div>

        <div class="tag">
            TEST SİSTEMİ
        </div>

    </header>


    <main>

        {% block content %}
        {% endblock %}

    </main>

</div>


<!-- ==================================================
     LOADING SCRIPT
================================================== -->

<script>

document.addEventListener("DOMContentLoaded", function () {

    const loadingScreen =
        document.getElementById("loading-screen");

    const progressBar =
        document.getElementById("progress-bar");

    const progressNumber =
        document.getElementById("progress-number");

    const statusTitle =
        document.getElementById("status-title");

    const statusSubtitle =
        document.getElementById("status-subtitle");

    const loadingStep =
        document.getElementById("loading-step");


    /*
       ÜMUMİ MÜDDƏT:
       15 saniyə
    */

    const totalTime = 15000;

    const startTime = Date.now();


    /*
       Loading mərhələləri
    */

    const stages = [

        {
            time: 0,
            title: "Sistem hazırlanır...",
            subtitle: "Zəhmət olmasa bir neçə saniyə gözləyin.",
            step: "Hazırlıq mərhələsi"
        },

        {
            time: 3000,
            title: "Qanunvericilik bazası yoxlanılır...",
            subtitle: "Əmək Məcəlləsi üzrə məlumatlar hazırlanır.",
            step: "Məlumat bazası"
        },

        {
            time: 6000,
            title: "Test sualları hazırlanır...",
            subtitle: "Suallar test mühiti üçün uyğunlaşdırılır.",
            step: "Suallar hazırlanır"
        },

        {
            time: 9000,
            title: "Test mühiti işə salınır...",
            subtitle: "Sizin üçün hər şey hazır vəziyyətə gətirilir.",
            step: "Test mühiti"
        },

        {
            time: 12000,
            title: "Son hazırlıqlar tamamlanır...",
            subtitle: "Artıq başlamağa hazırsınız!",
            step: "Son mərhələ"
        }

    ];


    let currentStage = -1;


    function updateLoading() {

        const elapsed =
            Date.now() - startTime;


        let progress =
            Math.min(
                (elapsed / totalTime) * 100,
                100
            );


        /*
           Faiz
        */

        progressNumber.textContent =
            Math.floor(progress) + "%";


        /*
           Progress bar
        */

        progressBar.style.width =
            progress + "%";


        /*
           Mərhələ dəyişməsi
        */

        for (let i = stages.length - 1; i >= 0; i--) {

            if (elapsed >= stages[i].time) {

                if (currentStage !== i) {

                    currentStage = i;

                    statusTitle.classList.add("change");
                    statusSubtitle.classList.add("change");

                    setTimeout(function () {

                        statusTitle.textContent =
                            stages[i].title;

                        statusSubtitle.textContent =
                            stages[i].subtitle;

                        loadingStep.textContent =
                            stages[i].step;

                        statusTitle.classList.remove("change");
                        statusSubtitle.classList.remove("change");

                    }, 200);

                }

                break;
            }

        }


        /*
           15 saniyə tamamlandı
        */

        if (elapsed >= totalTime) {

            progressNumber.textContent = "100%";

            progressBar.style.width = "100%";

            statusTitle.textContent =
                "Hazırıq! Uğurlar! ⚖️";

            statusSubtitle.textContent =
                "Test başlayır...";

            loadingStep.textContent =
                "Tamamlandı";


            setTimeout(function () {

                loadingScreen.classList.add("loaded");

                setTimeout(function () {

                    loadingScreen.style.display =
                        "none";

                }, 800);

            }, 700);


            return;

        }


        requestAnimationFrame(updateLoading);

    }


    updateLoading();

});

</script>

</body>

</html>
