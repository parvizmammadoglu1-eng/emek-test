<!doctype html>
<html lang="az">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Əmək Məcəlləsi</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            overflow-x: hidden;
        }

        body {
            background: #f5f7fb;
        }

        /* =====================================================
           YUXARI MƏLUMAT PANELİ
        ===================================================== */

        .status-bar {
            width: 100%;
            background: linear-gradient(
                135deg,
                #173b73,
                #2563eb
            );

            color: white;

            padding: 8px 10px;

            box-shadow:
                0 4px 15px rgba(0,0,0,0.12);
        }


        .status-container {

            width: 100%;
            max-width: 1100px;

            margin: 0 auto;

            display: flex;

            justify-content: center;
            align-items: center;

            gap: 8px;

            flex-wrap: nowrap;

            overflow: hidden;
        }


        /* =====================================================
           HƏR MƏLUMAT
        ===================================================== */

        .status-item {

            display: flex;

            align-items: center;
            justify-content: center;

            gap: 5px;

            min-width: 0;

            padding: 7px 10px;

            border-radius: 10px;

            background:
                rgba(255,255,255,0.12);

            border:
                1px solid rgba(255,255,255,0.18);

            backdrop-filter:
                blur(8px);

            -webkit-backdrop-filter:
                blur(8px);

            white-space: nowrap;

            font-size: 13px;

            font-weight: 600;

            box-shadow:
                0 3px 10px rgba(0,0,0,0.08);
        }


        .status-icon {

            font-size: 15px;

            flex-shrink: 0;
        }


        .status-text {

            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;
        }


        /* =====================================================
           MOBİL
        ===================================================== */

        @media (max-width: 600px) {

            .status-bar {

                padding:
                    6px 3px;
            }


            .status-container {

                width: 100%;

                gap: 3px;

                flex-wrap: nowrap;

                justify-content: center;
            }


            .status-item {

                flex:
                    1 1 0;

                min-width: 0;

                padding:
                    6px 4px;

                gap: 3px;

                border-radius: 8px;

                font-size: 10px;

                overflow: hidden;
            }


            .status-icon {

                font-size: 12px;
            }


            .status-text {

                overflow: hidden;

                text-overflow: ellipsis;
            }
        }


        /* =====================================================
           ÇOX KİÇİK TELEFONLAR
        ===================================================== */

        @media (max-width: 380px) {

            .status-container {

                gap: 2px;
            }


            .status-item {

                padding:
                    5px 2px;

                font-size: 9px;

                gap: 2px;
            }


            .status-icon {

                font-size: 11px;
            }
        }

    </style>

</head>


<body>


    <!-- =====================================================
         SAAT / TARİX / HAVA
    ===================================================== -->

    <div class="status-bar">

        <div class="status-container">


            <!-- SAAT -->

            <div class="status-item">

                <span class="status-icon">
                    🕐
                </span>

                <span
                    class="status-text"
                    id="clock"
                >
                    00:00:00
                </span>

            </div>


            <!-- TARİX -->

            <div class="status-item">

                <span class="status-icon">
                    📅
                </span>

                <span
                    class="status-text"
                    id="date"
                >
                    00.00.0000
                </span>

            </div>


            <!-- HAVA -->

            <div class="status-item">

                <span class="status-icon">
                    ☀️
                </span>

                <span
                    class="status-text"
                    id="weather"
                >
                    Bakı 29°C
                </span>

            </div>


        </div>

    </div>



    <!-- =====================================================
         ƏSAS SƏHİFƏ
    ===================================================== -->

    <main>

        {% block content %}

        {% endblock %}

    </main>



    <!-- =====================================================
         JAVASCRIPT
    ===================================================== -->

    <script>

        /* =====================================================
           SAAT VƏ TARİX
        ===================================================== */

        function updateDateTime() {

            const now = new Date();


            const hours =
                String(
                    now.getHours()
                ).padStart(2, "0");


            const minutes =
                String(
                    now.getMinutes()
                ).padStart(2, "0");


            const seconds =
                String(
                    now.getSeconds()
                ).padStart(2, "0");


            const day =
                String(
                    now.getDate()
                ).padStart(2, "0");


            const month =
                String(
                    now.getMonth() + 1
                ).padStart(2, "0");


            const year =
                now.getFullYear();


            document.getElementById(
                "clock"
            ).textContent =
                `${hours}:${minutes}:${seconds}`;


            document.getElementById(
                "date"
            ).textContent =
                `${day}.${month}.${year}`;
        }


        updateDateTime();


        setInterval(
            updateDateTime,
            1000
        );



        /* =====================================================
           HAVA İKONU
        ===================================================== */

        function getWeatherIcon(code) {

            if (code === 0) {
                return "☀️";
            }

            if (
                code === 1 ||
                code === 2
            ) {
                return "🌤️";
            }

            if (code === 3) {
                return "☁️";
            }

            if (
                code === 45 ||
                code === 48
            ) {
                return "🌫️";
            }

            if (
                code >= 51 &&
                code <= 67
            ) {
                return "🌧️";
            }

            if (
                code >= 71 &&
                code <= 77
            ) {
                return "❄️";
            }

            if (
                code >= 80 &&
                code <= 82
            ) {
                return "🌦️";
            }

            if (
                code >= 95 &&
                code <= 99
            ) {
                return "⛈️";
            }

            return "🌤️";
        }



        /* =====================================================
           BAKI DEFAULT
        ===================================================== */

        function showDefaultWeather() {

            const weather =
                document.getElementById(
                    "weather"
                );

            weather.textContent =
                "Bakı";
        }



        /* =====================================================
           HAVA MƏLUMATI
        ===================================================== */

        async function loadWeather(
            latitude,
            longitude,
            placeName
        ) {

            try {

                const weatherUrl =
                    "https://api.open-meteo.com/v1/forecast" +
                    "?latitude=" +
                    encodeURIComponent(latitude) +
                    "&longitude=" +
                    encodeURIComponent(longitude) +
                    "&current=temperature_2m,weather_code" +
                    "&temperature_unit=celsius" +
                    "&timezone=auto";


                const response =
                    await fetch(
                        weatherUrl
                    );


                if (!response.ok) {

                    throw new Error(
                        "Weather API error"
                    );
                }


                const data =
                    await response.json();


                const temperature =
                    Math.round(
                        data.current.temperature_2m
                    );


                const weatherCode =
                    data.current.weather_code;


                const icon =
                    getWeatherIcon(
                        weatherCode
                    );


                document.getElementById(
                    "weather"
                ).textContent =
                    `${placeName} ${temperature}°C`;


                document.querySelector(
                    ".status-item:last-child .status-icon"
                ).textContent =
                    icon;


            }

            catch (error) {

                console.log(
                    "Hava məlumatı alınmadı:",
                    error
                );

                document.getElementById(
                    "weather"
                ).textContent =
                    `${placeName}`;
            }
        }



        /* =====================================================
           MƏKAN ADINI TAP
           
           GPS koordinatından mümkün qədər konkret
           yaşayış məntəqəsi / rayon / qəsəbə / kənd
           məlumatını götürürük.
        ===================================================== */

        async function findLocation(
            latitude,
            longitude
        ) {

            try {

                /*
                 * Nominatim reverse geocoding
                 */

                const url =
                    "https://nominatim.openstreetmap.org/reverse" +
                    "?format=json" +
                    "&lat=" +
                    encodeURIComponent(latitude) +
                    "&lon=" +
                    encodeURIComponent(longitude) +
                    "&zoom=18" +
                    "&addressdetails=1" +
                    "&accept-language=az";


                const response =
                    await fetch(
                        url
                    );


                if (!response.ok) {

                    throw new Error(
                        "Location API error"
                    );
                }


                const data =
                    await response.json();


                const address =
                    data.address || {};


                /*
                 * Əvvəl ən konkret yaşayış məntəqəsini
                 * axtarırıq.
                 */

                const place =
                    address.village ||
                    address.hamlet ||
                    address.town ||
                    address.city ||
                    address.municipality ||
                    address.suburb ||
                    address.neighbourhood ||
                    address.county ||
                    address.city_district ||
                    "Məkan";


                return place;

            }

            catch (error) {

                console.log(
                    "Məkan müəyyən edilmədi:",
                    error
                );

                return "Məkan";
            }
        }



        /* =====================================================
           GPS
        ===================================================== */

        function getUserLocation() {

            /*
             * Geolocation dəstəklənmirsə Bakı
             */

            if (
                !navigator.geolocation
            ) {

                loadWeather(
                    40.4093,
                    49.8671,
                    "Bakı"
                );

                return;
            }


            navigator.geolocation.getCurrentPosition(

                async function(position) {

                    const latitude =
                        position.coords.latitude;


                    const longitude =
                        position.coords.longitude;


                    /*
                     * Konkret rayon/kənd/qəsəbə
                     */

                    const place =
                        await findLocation(
                            latitude,
                            longitude
                        );


                    /*
                     * Həmin koordinat üçün hava
                     */

                    await loadWeather(
                        latitude,
                        longitude,
                        place
                    );

                },


                function(error) {

                    console.log(
                        "Lokasiya icazəsi verilmədi:",
                        error
                    );


                    /*
                     * İcazə yoxdursa Bakı
                     */

                    loadWeather(
                        40.4093,
                        49.8671,
                        "Bakı"
                    );

                },


                {
                    enableHighAccuracy: true,

                    timeout: 10000,

                    maximumAge: 300000
                }
            );
        }



        /* =====================================================
           BAŞLAT
        ===================================================== */

        getUserLocation();


        /*
         * Havanı hər 10 dəqiqədən bir yenilə.
         */

        setInterval(
            getUserLocation,
            10 * 60 * 1000
        );

    </script>


</body>

</html>
