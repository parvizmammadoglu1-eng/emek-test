<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin giriş</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f6fb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .card {
            background: white;
            width: 90%;
            max-width: 420px;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #666;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 14px;
            margin: 20px 0 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .error {
            background: #fee2e2;
            color: #b91c1c;
            padding: 10px;
            border-radius: 8px;
            margin-top: 15px;
        }

        .emoji {
            font-size: 45px;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="emoji">🔐</div>

    <h1>Admin panel</h1>

    <p>
        Nəticələrə baxmaq üçün admin parolunu daxil edin.
    </p>

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

    <form method="POST">

        <input
            type="password"
            name="password"
            placeholder="Admin parolu"
            required
        >

        <button type="submit">
            DAXİL OL
        </button>

    </form>

</div>

</body>
</html>
