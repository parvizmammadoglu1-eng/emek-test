{% extends "base.html" %}

{% block content %}
<section class="card login">
    <div class="emoji">🔐</div>
    <h1>Admin panel</h1>
    <p>Nəticələrə baxmaq üçün admin parolunu daxil edin.</p>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    <form method="post">
        <input type="password" name="password" placeholder="Admin parolu" required>
        <button type="submit">DAXİL OL →</button>
    </form>
</section>
{% endblock %}
